[project]
name = "cc-handoff"
version = "0.1.0"
description = "Route work from a Claude Desktop chat into Claude Code, headless or in a terminal."
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
cc-handoff = "cc_handoff.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cc_handoff"]
